[package]
name        = "yzendris"
description = "Share one keyboard and mouse across computers over an encrypted LAN link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Windows only: embed a uiAccess="true" manifest so injected input can reach
# elevated windows. Such a binary only starts when signed and installed under
# %ProgramFiles% — see docs/WINDOWS-UIACCESS.md. Off by default.
uiaccess = []

[dependencies]
yzendris-core = { workspace = true }
anyhow     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }
tokio      = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros", "fs", "signal"] }
rustls       = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen      = { version = "0.14", default-features = false, features = ["ring", "pem"] }
spake2     = "0.4"
hmac       = "0.12"
sha2       = "0.10"
getrandom  = "0.3"
crc32fast  = "1"
arboard    = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev  = "0.13"
libc   = "0.2"
wayland-client    = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
x11rb  = { version = "0.13", features = ["randr"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
