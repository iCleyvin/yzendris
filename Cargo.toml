[workspace]
members  = ["crates/core", "crates/daemon", "crates/gui"]
resolver = "2"

[workspace.package]
version      = "0.2.0"
edition      = "2021"
rust-version = "1.85"
license      = "MIT"
repository   = "https://github.com/iCleyvin/yzendris"
authors      = ["Cleyvin"]

[workspace.dependencies]
yzendris-core = { path = "crates/core" }
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "1"
tracing    = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use        = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo      = "deny"

# Small, fast binaries: the daemon stays resident, so size and startup matter.
[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
debug         = false
