name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Ubuntu so the binaries run on any
          # distribution with glibc 2.35 or newer.
          - os: ubuntu-22.04
            name: yzendris-linux-x86_64
          - os: windows-latest
            name: yzendris-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "dist/${{ matrix.name }}"
          cp target/release/yzendris target/release/yzendris-gui LICENSE README.md "dist/${{ matrix.name }}/"
          cd dist
          tar -czf "${{ matrix.name }}.tar.gz" "${{ matrix.name }}"
          sha256sum "${{ matrix.name }}.tar.gz" > "${{ matrix.name }}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "dist/${{ matrix.name }}"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/yzendris.exe, target/release/yzendris-gui.exe, LICENSE, README.md $dir
          Compress-Archive -Path $dir -DestinationPath "dist/${{ matrix.name }}.zip"
          $hash = (Get-FileHash "dist/${{ matrix.name }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.name }}.zip" | Out-File -Encoding ascii "dist/${{ matrix.name }}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
