# yzendris — Linux client configuration
# Copy to ~/.config/yzendris/client.toml

# TCP port to listen on (server connects here).
port = 7547

# Bind address. "0.0.0.0" accepts from any interface; restrict to a specific
# LAN IP if you want to be paranoid.
bind_addr = "0.0.0.0"

# XKB layout to assign to the virtual keyboard device.
# Empty = auto-detect from `hyprctl devices -j` (first physical keyboard).
kb_layout = ""

# Milliseconds without a heartbeat before the client gives up on the server
# and releases all held keys (avoids stuck modifiers if the server crashes).
heartbeat_timeout_ms = 5000

# Sync clipboard on capture transitions. Requires wl-clipboard on PATH.
# Besides text, copied FILES are transferred too (one or many): copy files on
# one machine, cross to the other, and paste. Each file is CRC-checked; a
# corrupt or truncated transfer is discarded. Received files are written to
# <temp>/yzendris (on Linux: /tmp/yzendris, pruned after 24h) and put on the
# local clipboard. On Linux, paste-as-copy uses x-special/gnome-copied-files,
# honoured by GTK file managers (Nautilus, Nemo, Thunar, Caja, PCManFM).
clipboard = true

# Maximum size (MiB) of a single file moved via the clipboard. Larger files are
# skipped (protects the input link from being saturated). Default 500.
max_file_mb = 500

# TLS with SHA-256 fingerprint pinning, in BOTH directions. On first run with
# tls=true a self-signed certificate is generated in ~/.config/yzendris/ and its
# fingerprint is printed to stderr — paste it into the Windows server's
# trusted_peers.txt.
#
# You must also paste the SERVER's fingerprint into
# ~/.config/yzendris/trusted_peers.txt (one per line). Without it every
# connection is refused: that check is what stops anyone else on the LAN from
# connecting here and injecting keystrokes. A rejected handshake logs the
# fingerprint it saw, so start the host once and read the log if you need it.
tls = true
